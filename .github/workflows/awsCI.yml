name: CI

# tigger é a mudança na branch main
# Determinar as branches ou eventos que acionam a execução da pipeline.
on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write # Permissão para o token de acesso do GitHub Actions
  contents: read # Permissão para ler o conteúdo do repositório

# executado após o on (trigger), Configurar as etapas de construção e implantação do projeto.
jobs:
  build:
    name: "Build and push"
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     node: [16, 18]
    # boa utilização em projetos frontend

    steps:
      # entra no repo, por isso dessa action
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-node@v4
        with:
          # node-version: ${{ matrix.node }}
          node-version: 18
          cache: "npm"
          # caso seja monorepo tem que definir o path para ele achar o yarn.lock por ex
      - run: npm ci
      - run: npm test
      # daria para plugar um sonar aqui por ex

      # o name é o nome que aparece na execução do job, e pode ser qualquer coisa
      # o run é o comando que vai executar
      # o run pode ser um script ou um comando direto
      - name: Generate tag
        # boa pratica quando se tem outputs
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
      # ---------------------- aws ----------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::132955064359:role/ecr-role # o role é o papel que vai assumir, com isso o acesso é a determinados serviços e não a tudo
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build docker image
        id: build-image
        # tem uma forma melhor de fazer isso, que é pegando o output do login acima
        # run: |
        #   docker build -t 132955064359.dkr.ecr.us-east-2.amazonaws.com/luks-ci/devops.ci.api:${{ steps.generate_tag.outputs.sha }} .
        #   docker push 132955064359.dkr.ecr.us-east-2.amazonaws.com/luks-ci/devops.ci.api:${{ steps.generate_tag.outputs.sha }}
        env:
          REGISTRY: ${{steps.login-ecr.outputs.registry}}
          TAG:
            ${{ steps.generate_tag.outputs.sha }}

            # pega o nome da imagem
        run: |
          docker build -t $REGISTRY/devops.ci.api:$TAG .
          docker push $REGISTRY/devops.ci.api:$TAG
          IMAGE=$(echo $REGISTRY/devops.ci.api:$TAG)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        env:
          REPOSITORY_NAME: ${{steps.checkout.outputs.repository}}
          IMAGE: ${{ steps.build-image.outputs.image }}
        with:
          service: devops-ci-api # nome do serviço que vai subir no app runner
          image: $IMAGE # Pode subir como env no github
          access-role-arn: arn:aws:iam::132955064359:role/app-runner-role # Pode subir como env no github
          region: us-east-2
          cpu: 1
          memory: 2
          port: 3000 # igual o dockerfile

